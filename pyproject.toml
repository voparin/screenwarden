[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenwarden"
version = "0.1.0"
description = "Linux parental screen time control daemon"
requires-python = ">=3.11"
authors = [{name = "voparin"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["parental-control", "screen-time", "linux", "family"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/voparin/screenwarden"
Issues = "https://github.com/voparin/screenwarden/issues"

[project.scripts]
screenwarden = "screenwarden.cli.main:main"
screenwarden-notify = "screenwarden.notifier.main:main"
screenwarden-daemon = "screenwarden.daemon.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/screenwarden"]
